<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health Warrior: Education Edition</title>
    <style>
        :root { --pico-bg: #1a1a1a; --pico-hero: #3498db; --pico-hp: #ff4757; }
        body { font-family: 'Arial Black', sans-serif; background-color: var(--pico-bg); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        #start-screen, #over-screen {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; text-align: center;
        }
        #over-screen { display: none; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .btn { padding: 18px 50px; font-size: 24px; background: #2ecc71; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 20px 0; box-shadow: 0 5px 0 #27ae60; }
        
        #ui-top { display: flex; justify-content: space-between; width: 95%; max-width: 450px; padding: 10px; color: white; }
        #hp-bar-bg { width: 150px; height: 20px; background: #333; border: 2px solid white; border-radius: 10px; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: var(--pico-hp); transition: width 0.1s; }
        
        #question-box { background: #2c3e50; color: white; padding: 12px; border-radius: 8px; width: 95%; max-width: 450px; text-align: center; margin-bottom: 5px; font-size: 15px; border: 2px solid #34495e; min-height: 50px; display: flex; align-items: center; justify-content: center; }
        canvas { background-color: #222; border: 4px solid #444; width: 95%; max-width: 450px; height: auto; }
        
        #mobile-controls { display: none; width: 95%; max-width: 450px; justify-content: space-between; margin-top: 10px; }
        .ctrl-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 2px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: white; user-select: none; }
        
        #review-area { text-align: left; background: #333; padding: 15px; border-radius: 10px; width: 100%; max-width: 400px; font-size: 14px; margin-top: 10px; }
        .review-item { border-bottom: 1px solid #555; padding: 5px 0; }
        @media (max-width: 850px) { #mobile-controls { display: flex; } }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color: #f1c40f;">🛡️ 地牢戰士：解說版</h1>
    <div style="text-align: left; background: #222; padding: 20px; border-radius: 15px; border: 1px solid #444; font-size: 14px;">
        <p>🎒 <b>收集正確答案</b>：碰到正確答案得 100 分並過關。</p>
        <p>❌ <b>避開錯誤答案</b>：碰到錯的會扣血與扣分！</p>
        <p>🚀 <b>目標</b>：活下去，挑戰 22 題全部正確！</p>
    </div>
    <button class="btn" id="start-btn">開始挑戰</button>
</div>

<div id="over-screen">
    <h1 style="color: #e74c3c;">挑戰結束</h1>
    <h2 id="final-score">得分：0</h2>
    <div id="review-area">
        <h3>📚 衛教重點回顧：</h3>
        <div id="review-list"></div>
    </div>
    <button class="btn" id="retry-btn">再次闖關</button>
</div>

<div id="ui-top">
    <div style="display:flex; align-items:center; gap:10px;">
        <span>HP</span>
        <div id="hp-bar-bg"><div id="hp-fill"></div></div>
    </div>
    <div id="status-score">SCORE: 0</div>
</div>
<div id="question-box">準備進入地牢...</div>
<canvas id="game-canvas" width="400" height="550"></canvas>

<div id="mobile-controls">
    <div style="display:flex; gap:20px;"><div class="ctrl-btn" id="ml">⬅️</div><div class="ctrl-btn" id="mr">➡️</div></div>
    <div class="ctrl-btn" id="mj" style="background:#27ae60">🎒</div>
</div>

<script>
    const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');
    
    const quizBank = [
        { q: "成人每日建議飲水量是體重(kg)乘以多少？", options: ["10ml", "20ml", "30-35ml", "100ml"], correct: 2 },
        { q: "洗手「內外夾弓大立腕」，最後是？", options: ["手指", "指甲", "手心", "手腕"], correct: 3 },
        { q: "正確刷牙法「貝氏刷牙法」，刷毛夾角？", options: ["15度", "45度", "90度", "180度"], correct: 1 },
        { q: "預防近視，用眼30分鐘應休息多久？", options: ["1分鐘", "10分鐘", "30分鐘", "不必"], correct: 1 },
        { q: "下列何者是攝取維生素C的好來源？", options: ["漢堡", "芭樂", "泡麵", "可樂"], correct: 1 },
        { q: "哪種營養素是身體主要的能量來源？", options: ["碳水化合物", "纖維質", "維生素", "礦物質"], correct: 0 },
        { q: "遇到有人中暑，首要動作是什麼？", options: ["餵退燒藥", "移至陰涼處", "給予冰水", "大力搖晃"], correct: 1 },
        { q: "正常成人的收縮壓應低於多少 mmHg？", options: ["120", "140", "160", "180"], correct: 0 },
        { q: "BMI 的計算公式是體重(kg)除以什麼？", options: ["身高m", "身高m平方", "年齡", "腰圍"], correct: 1 },
        { q: "下列哪項不屬於均衡飲食的六大類食物？", options: ["豆魚蛋肉類", "油脂類", "零食類", "乳品類"], correct: 2 },
        { q: "AED 是什麼設備的縮寫？", options: ["自動除顫器", "血壓計", "血糖機", "體脂計"], correct: 0 },
        { q: "抽菸最容易直接損害哪一個器官？", options: ["心臟", "肺部", "腎臟", "大腦"], correct: 1 },
        { q: "預防登革熱最重要的措施是？", options: ["打流感疫苗", "清除積水容器", "多喝開水", "不吃生食"], correct: 1 },
        { q: "哪一種運動最能強化骨質密度？", options: ["游泳", "重量訓練", "伸展運動", "下棋"], correct: 1 },
        { q: "健康成年人每日食鹽攝取量應低於？", options: ["3克", "6克", "15克", "20克"], correct: 1 },
        { q: "預防愛滋病最安全的方法？", options: ["共用針頭", "全程戴套", "多運動", "吃補藥"], correct: 1 },
        { q: "下列何者是預防大腸癌的良好習慣？", options: ["多吃蔬果", "多吃紅肉", "抽菸", "熬夜"], correct: 0 },
        { q: "長期缺乏睡眠會增加哪種風險？", options: ["免疫力提升", "肥胖與心血管", "視力變好", "肌肉增長"], correct: 1 },
        { q: "流感與感冒的主要區別？", options: ["流感症狀更重", "沒差別", "感冒必發燒", "流感不具傳染"], correct: 0 },
        { q: "心理健康的定義不包括？", options: ["情緒穩定", "完全沒壓力", "良好人際", "應對挑戰"], correct: 1 },
        { q: "下列何者為含糖飲料過量攝取的危害？", options: ["蛀牙與肥胖", "長高", "增強專注", "預防感冒"], correct: 0 },
        { q: "實施 CPR 時，按壓頻率應為每分鐘？", options: ["60次", "80次", "100-120次", "200次"], correct: 2 }
    ];

    let cur = 0, score = 0, hp = 1000, running = false, isPaused = false;
    let pauseTimer = 0, scrollSpeed = 0.9, animId = null;
    let platforms = [], items = [];
    const player = { x: 180, y: 100, vx: 0, vy: 0, size: 32, ground: false };
    const keys = {};

    function createPlatform(y) {
        let type = (Math.random() > 0.7) ? 'flip' : 'normal';
        return { x: Math.random() * 280, y: y, w: 120, h: 12, type: type, flipTimer: 60, isVisible: true, hasItem: false };
    }

    function init() {
        cur = 0; score = 0; hp = 1000; scrollSpeed = 0.9;
        platforms = []; items = [];
        for (let i = 0; i < 6; i++) platforms.push(createPlatform(i * 100 + 150));
        player.x = 180; player.y = 100; player.vy = 0;
        startPause();
    }

    function startPause() {
        isPaused = true; pauseTimer = 180; updateUI();
    }

    function updateUI() {
        document.getElementById('question-box').innerText = quizBank[cur].q;
        document.getElementById('hp-fill').style.width = (hp/1000 * 100) + "%";
        document.getElementById('status-score').innerText = "SCORE: " + score;
    }

    document.getElementById('start-btn').onclick = () => { document.getElementById('start-screen').style.display = 'none'; start(); };
    document.getElementById('retry-btn').onclick = () => { window.location.reload(); };

    function start() { running = true; init(); loop(); }

    const bind = (id, k) => {
        const el = document.getElementById(id);
        el.onpointerdown = (e) => { e.preventDefault(); keys[k] = true; };
        el.onpointerup = (e) => { e.preventDefault(); keys[k] = false; };
    };
    bind('ml', 'ArrowLeft'); bind('mr', 'ArrowRight'); bind('mj', 'ArrowUp');
    window.onkeydown = (e) => { keys[e.code] = true; };
    window.onkeyup = (e) => { keys[e.code] = false; };

    function update() {
        if (!running) return;
        if (isPaused) { pauseTimer--; if (pauseTimer <= 0) isPaused = false; return; }

        player.vx = (keys['ArrowLeft'] || keys['ArrowRight']) ? (keys['ArrowLeft'] ? -5 : 5) : player.vx * 0.8;
        player.vy += 0.5; player.x += player.vx; player.y += player.vy; player.ground = false;

        platforms.forEach(p => {
            p.y -= scrollSpeed;
            if (p.isVisible && player.x + player.size > p.x && player.x < p.x + p.w && player.y + player.size > p.y && player.y + player.size < p.y + 15 && player.vy >= 0) {
                player.y = p.y - player.size; player.vy = 0; player.ground = true;
                if(p.type === 'flip') { p.flipTimer--; if(p.flipTimer <= 0) p.isVisible = false; }
            }
            if (!p.hasItem && p.isVisible && Math.random() < 0.02 && items.length < 4) {
                p.hasItem = true;
                // 提高正確答案出現率
                const isCorrect = Math.random() > 0.4;
                const text = isCorrect ? quizBank[cur].options[quizBank[cur].correct] : quizBank[cur].options[Math.floor(Math.random()*4)];
                items.push({ x: p.x + 20, y: p.y - 45, text: text, pRef: p, isCorrect: text === quizBank[cur].options[quizBank[cur].correct] });
            }
        });

        if (platforms[0].y < -20) { platforms.shift(); platforms.push(createPlatform(560)); score += 5; }

        items.forEach((it, i) => {
            it.y = it.pRef.y - 45;
            if (Math.abs(player.x - it.x) < 40 && Math.abs(player.y - it.y) < 50) {
                if (it.isCorrect) {
                    score += 100; cur = (cur + 1) % quizBank.length;
                    items = []; startPause(); 
                } else {
                    hp -= 200; score = Math.max(0, score - 50); items.splice(i, 1); updateUI();
                    if(hp<=0) end();
                }
            }
            if (it.y < -50 || !it.pRef.isVisible) items.splice(i, 1);
        });

        if (player.y < 10 || player.y > 550) { hp -= 200; player.y = 150; player.vy = 2; updateUI(); if(hp<=0) end(); }
        if (player.x < 0) player.x = 0; if (player.x > 368) player.x = 368;
    }

    function end() { 
        running = false; 
        document.getElementById('over-screen').style.display = 'flex'; 
        document.getElementById('final-score').innerText = "最終得分：" + score;
        
        const list = document.getElementById('review-list');
        list.innerHTML = "";
        // 顯示解說（顯示前 5 題重點）
        quizBank.slice(0, 10).forEach(item => {
            const div = document.createElement('div');
            div.className = "review-item";
            div.innerHTML = `<b>問：</b>${item.q}<br><b style="color:#2ecc71">答：</b>${item.options[item.correct]}`;
            list.appendChild(div);
        });
    }

    function drawWarrior(x, y) {
        ctx.fillStyle = "#3498db"; ctx.fillRect(x+4, y+8, 24, 24);
        ctx.fillStyle = "#34495e"; ctx.fillRect(x, y, 32, 10);
        ctx.fillStyle = "#e67e22"; ctx.fillRect(x-4, y+8, 8, 20);
        ctx.fillStyle = "white"; ctx.fillRect(x+8, y+14, 4, 4); ctx.fillRect(x+20, y+14, 4, 4);
    }

    function draw() {
        ctx.clearRect(0, 0, 400, 550);
        ctx.fillStyle = "#ff4757"; ctx.fillRect(0, 0, 400, 10);
        
        platforms.forEach(p => {
            if(!p.isVisible) return;
            ctx.fillStyle = (p.type === 'flip') ? "#ecf0f1" : "#7f8c8d";
            ctx.fillRect(p.x, p.y, p.w, p.h);
        });
        
        items.forEach(it => {
            ctx.fillStyle = "#f1c40f"; ctx.beginPath(); ctx.arc(it.x+15, it.y+15, 12, 0, 7); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.fillText(it.text, it.x+15, it.y-10);
        });

        drawWarrior(player.x, player.y);

        if (isPaused) {
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, 400, 550);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("下一關題目", 200, 240);
            ctx.fillStyle = "white"; ctx.font = "16px sans-serif";
            let q = quizBank[cur].q;
            ctx.fillText(q.length > 22 ? q.substring(0,22) + "..." : q, 200, 280);
            ctx.fillText(`(倒數 ${Math.ceil(pauseTimer/60)})`, 200, 320);
        }
    }

    function loop() { if(!running) return; update(); draw(); animId = requestAnimationFrame(loop); }
</script>
</body>
</html>
